server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    # SPA fallback: a hard refresh on /calendar/2026-08 must serve index.html, not 404.
    try_files $uri $uri/ /index.html;
  }

  # NOTE: deliberately no /api proxy here. Traefik splits /api off to the backend before
  # traffic reaches this container.
}
