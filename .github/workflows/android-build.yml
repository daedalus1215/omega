name: Android build

on:
  push:
    paths: ['frontend/**', '.github/workflows/android-build.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
    inputs:
      target:
        description: Which app to build (dev installs alongside prod as "Omega Dev")
        type: choice
        options: [prod, dev]
        default: prod

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # vite.config.ts imports it; the values only matter for the dev server.
      - run: cp vite.env.config.sample.ts vite.env.config.ts

      # push/pull_request carry no event.inputs, so this always falls back to prod there.
      # The URL only prefills the app's first-launch screen; the Cloudflare Access
      # token is entered there too, never built in, since anyone signed in to
      # GitHub can download this repo's artifacts.
      - id: target
        run: |
          if [ "${{ github.event.inputs.target }}" = "dev" ]; then
            echo "url=${{ vars.ANDROID_SERVER_URL_DEV }}" >> "$GITHUB_OUTPUT"
            echo "name=dev" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ vars.ANDROID_SERVER_URL }}" >> "$GITHUB_OUTPUT"
            echo "name=prod" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run android:sync
        env:
          VITE_DEFAULT_SERVER_URL: ${{ steps.target.outputs.url }}
          CAPACITOR_TARGET: ${{ steps.target.outputs.name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # app/build.gradle reads it too, for the package id and launcher label.
      - run: ./gradlew assembleDebug
        working-directory: frontend/android
        env:
          CAPACITOR_TARGET: ${{ steps.target.outputs.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: omega-${{ steps.target.outputs.name }}-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
